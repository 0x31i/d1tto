[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d1tto"
version = "0.1.0"
description = "Copies your clipboard straight into an Obsidian pentest engagement: auto-detects your vault, scaffolds the folder tree, captures evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elias Sims" }]
keywords = ["pentest", "obsidian", "notes", "evidence", "cli", "security", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "pyperclip>=1.8",
    "pillow>=10.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/0x31i/d1tto"
Repository = "https://github.com/0x31i/d1tto"
Issues = "https://github.com/0x31i/d1tto/issues"

[project.scripts]
d1tto = "d1tto.cli:main"
d1t = "d1tto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
